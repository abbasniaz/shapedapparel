<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SHAPED Design Studio</title>
  <link rel="stylesheet" href="designer.css?v=16001" />
  <script defer src="designer.js?v=16001"></script>
</head>
<body class="designer-page">
  <main class="designer-shell">
    <section class="controls-panel">
      <div class="panel-head">
        <p class="eyebrow">DESIGN STUDIO</p>
        <h1>Create Your Custom Apparel</h1>
        <p>Customize on the left, preview live on the right.</p>
      </div>

      <form id="designer-form" class="controls-grid">
        <div class="field">
          <label for="product-type">Product Type</label>
          <select id="product-type">
            <option value="tshirt">T-shirt</option>
            <option value="hoodie">Hoodie</option>
            <option value="tote">Tote Bag</option>
          </select>
        </div>

        <div class="field">
          <label for="view-side">Design Side</label>
          <select id="view-side">
            <option value="front">Front</option>
            <option value="back">Back</option>
          </select>
        </div>

        <div class="field">
          <label for="shirt-color">Product Color</label>
          <select id="shirt-color">
            <option value="#111111">Black</option>
            <option value="#1f2937">Charcoal</option>
            <option value="#374151">Dark Gray</option>
            <option value="#6b7280">Gray</option>
            <option value="#9ca3af">Light Gray</option>
            <option value="#f3f4f6">White</option>
            <option value="#f5e6c8">Cream</option>
            <option value="#c2a383">Sand</option>
            <option value="#7c5a3a">Brown</option>
            <option value="#8b1e3f">Maroon</option>
            <option value="#b91c1c">Red</option>
            <option value="#f97316">Orange</option>
            <option value="#eab308">Yellow</option>
            <option value="#2f6b57">Forest Green</option>
            <option value="#16a34a">Green</option>
            <option value="#14b8a6">Teal</option>
            <option value="#0ea5e9">Sky Blue</option>
            <option value="#395b8a">Royal Blue</option>
            <option value="#1d4ed8">Blue</option>
            <option value="#312e81">Indigo</option>
            <option value="#7c3aed">Purple</option>
            <option value="#db2777">Pink</option>
          </select>
        </div>

        <div class="field">
          <label for="shirt-color-custom">Custom Product Color</label>
          <input id="shirt-color-custom" type="color" value="#111111" />
        </div>

        <div class="field span-2">
          <label for="print-text">Print Text</label>
          <input id="print-text" type="text" value="SHAPED" maxlength="40" />
        </div>

        <div class="field">
          <label for="print-color">Text Color</label>
          <select id="print-color">
            <option value="#ffffff">White</option>
            <option value="#111111">Black</option>
            <option value="#d4a64f">Gold</option>
            <option value="#2f6b57">Green</option>
            <option value="#2b6cb0">Blue</option>
            <option value="#e11d48">Red</option>
            <option value="#7c3aed">Purple</option>
          </select>
        </div>

        <div class="field">
          <label for="print-color-custom">Custom Text Color</label>
          <input id="print-color-custom" type="color" value="#ffffff" />
        </div>

        <div class="field">
          <label for="text-size">Text Size</label>
          <input id="text-size" type="range" min="16" max="96" value="42" />
        </div>

        <div class="field">
          <label for="design-size">Image Size</label>
          <input id="design-size" type="range" min="15" max="80" value="48" />
        </div>

        <div class="field span-2">
          <label for="design-upload">Upload Design (PNG)</label>
          <input id="design-upload" type="file" accept=".png,image/png" />
          <small>Tip: use transparent PNG. In Move mode, drag the image on product.</small>
        </div>

        <div class="field span-2">
          <label>Text Style</label>
          <div class="btn-row">
            <button type="button" class="chip active" id="text-bold">Bold</button>
            <button type="button" class="chip" id="text-italic">Italic</button>
            <button type="button" class="chip" id="text-uppercase">UPPER</button>
            <button type="button" class="chip" id="align-left">Left</button>
            <button type="button" class="chip active" id="align-center">Center</button>
            <button type="button" class="chip" id="align-right">Right</button>
          </div>
        </div>

        <div class="field">
          <label>Mode</label>
          <div class="btn-row">
            <button type="button" class="chip active" id="mode-move">Move</button>
            <button type="button" class="chip" id="mode-draw">Draw</button>
            <button type="button" class="chip" id="mode-erase">Erase</button>
          </div>
        </div>

        <div class="field">
          <label for="brush-color">Brush Color</label>
          <input id="brush-color" type="color" value="#ff0000" />
        </div>

        <div class="field">
          <label for="brush-size">Brush Size</label>
          <input id="brush-size" type="range" min="1" max="40" value="6" />
        </div>

        <div class="field span-2">
          <label>Actions</label>
          <div class="btn-row">
            <button type="button" class="cta muted" id="undo-draw">Undo</button>
            <button type="button" class="cta muted" id="redo-draw">Redo</button>
            <button type="button" class="cta muted" id="clear-drawing">Clear</button>
            <button type="button" class="cta muted" id="save-draft">Save</button>
            <button type="button" class="cta muted" id="load-draft">Load</button>
            <button type="button" class="cta" id="download-design">Download PNG</button>
            <button type="button" class="cta muted" id="reset-all">Reset</button>
          </div>
        </div>

        <div class="field span-2">
          <button type="submit" class="cta full">Continue to Quote Form</button>
        </div>
      </form>
    </section>

    <section class="preview-panel">
      <div class="preview-top">
        <strong id="preview-label">Preview • Front</strong>
        <span>Drag on preview for 3D tilt</span>
      </div>

      <div class="preview-stage">
        <div class="mock-shirt tshirt" id="mock-shirt">
          <div class="hoodie-pocket"></div>
          <div class="tote-handle left"></div>
          <div class="tote-handle right"></div>

          <div class="safe-area"></div>
          <canvas id="draw-canvas"></canvas>
          <img id="shirt-design-image" alt="Uploaded design preview" />
          <span id="shirt-text">SHAPED</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
