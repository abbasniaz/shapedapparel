<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SHAPED premium custom apparel for businesses, teams and events. Built by Intent." />
  <title>SHAPED | Built by Intent</title>

  <link rel="stylesheet" href="styles.css?v=11009" />
  <script defer src="script.js?v=11009"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="announcement">FREE SAMPLE CONSULTATION • BULK & CORPORATE ORDERS WELCOME</div>

  <header class="site-header">
    <a class="brand-right" href="#home" aria-label="SHAPED home">
      <img src="assets/dsigner 18.png" alt="SHAPED" onerror="this.style.display='none'; this.parentElement.classList.add('logo-fallback')" />
      <span class="logo-text">SHAPED</span>
    </a>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

    <nav class="nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#quote-form">Custom Orders</a>
      <a href="designer.html">Design Studio</a>
      <a href="#contact">Contact</a>
    </nav>

    <button class="cart-button" aria-label="Open cart">
      <span class="cart-icon">🛍️</span>
      <span>Bag</span>
      <span id="cart-count">0</span>
    </button>
  </header>

  <main id="main">
    <section id="home" class="hero bg-home full-bleed">
      <div class="hero-copy reveal float-card">
        <p class="eyebrow">SHAPED APPAREL</p>
        <h1>BUILT BY <span>INTENT</span></h1>
        <p>Premium custom apparel for businesses, teams, events and everyday wear.</p>
        <div class="actions">
          <a class="button primary shine" href="#shop">SHOP NOW</a>
          <a class="button secondary" href="#custom">Start a Custom Order</a>
        </div>
      </div>

      <div class="hero-slideshow reveal" aria-label="SHAPED hero slideshow">
        <div class="hero-slide is-active"><img src="assets/Designer (19).png" alt="SHAPED design preview 1" /></div>
        <div class="hero-slide"><img src="assets/Designer (20).png" alt="SHAPED design preview 2" /></div>
        <div class="hero-slide"><img src="assets/Designer (19).png" alt="SHAPED design preview 3" /></div>
        <div class="hero-slide"><img src="assets/Designer (20).png" alt="SHAPED design preview 4" /></div>

        <button class="hero-nav hero-prev" aria-label="Previous slide">‹</button>
        <button class="hero-nav hero-next" aria-label="Next slide">›</button>
        <div class="hero-dots" role="tablist" aria-label="Slideshow indicators"></div>
      </div>
    </section>
  </main>
</body>
</html>
