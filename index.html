<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SHAPED premium custom apparel for businesses, teams and events. Built by Intent." />
  <title>SHAPED | Built by Intent</title>

  <!-- cache-busted css -->
  <link rel="stylesheet" href="styles.css?v=2" />
  <script defer src="script.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="announcement">FREE SAMPLE CONSULTATION • BULK & CORPORATE ORDERS WELCOME</div>

  <header class="site-header">
    <a class="brand-right" href="#home" aria-label="SHAPED home">
      <img src="assets/Designer (18).png" alt="SHAPED logo" />
    </a>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

    <nav class="nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#custom">Custom Orders</a>
      <a href="#studio">Design Studio</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

    <button class="cart-button" aria-label="Open cart">Bag <span id="cart-count">0</span></button>
  </header>

  <main id="main">
    <section id="home" class="hero">
      <div class="hero-copy">
        <p class="eyebrow">SHAPED APPAREL</p>
        <h1>BUILT BY <span>INTENT</span></h1>
        <p>Premium custom apparel for businesses, teams, events and everyday wear.</p>
        <div class="actions">
          <a class="button primary" href="#shop">SHOP NOW</a>
          <a class="button secondary" href="#custom">Start a Custom Order</a>
        </div>
      </div>

      <div class="hero-slideshow" aria-label="SHAPED hero slideshow">
        <div class="hero-slide is-active"><img src="assets/shaped-black-tee.jpg" alt="Black SHAPED tee" /></div>
        <div class="hero-slide"><img src="assets/shaped-white-tee.jpg" alt="White SHAPED tee" /></div>
        <div class="hero-slide"><img src="assets/hoodie-black.jpg" alt="Black SHAPED hoodie" /></div>
        <div class="hero-slide"><img src="assets/polo-black.jpg" alt="Corporate black polo" /></div>

        <button class="hero-nav hero-prev" aria-label="Previous slide">‹</button>
        <button class="hero-nav hero-next" aria-label="Next slide">›</button>

        <div class="hero-dots" role="tablist" aria-label="Slideshow indicators">
          <button class="hero-dot is-active" aria-label="Go to slide 1" aria-selected="true"></button>
          <button class="hero-dot" aria-label="Go to slide 2" aria-selected="false"></button>
          <button class="hero-dot" aria-label="Go to slide 3" aria-selected="false"></button>
          <button class="hero-dot" aria-label="Go to slide 4" aria-selected="false"></button>
        </div>
      </div>
    </section>
  </main>

  <aside class="cart" aria-hidden="true">
    <div class="cart-head"><h2>Your bag</h2><button class="cart-close" aria-label="Close cart">×</button></div>
    <div id="cart-items"></div>
    <div class="cart-foot"><button class="button primary full" id="checkout">Checkout</button></div>
  </aside>

  <div class="overlay"></div>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
